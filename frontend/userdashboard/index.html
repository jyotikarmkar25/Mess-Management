<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Mess Management</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-utensils"></i> Mess dashboard</h2>
            </div>
            <nav class="sidebar-menu">
                <ul>
                    <li class="active" data-target="todays-menu">
                        <i class="fas fa-calendar-day"></i> Today's Menu
                    </li>
                    <li data-target="attendance">
                        <i class="fas fa-check-circle"></i> Meal Attendance
                    </li>
                    <li data-target="feedback">
                        <i class="fas fa-comment-dots"></i> Feedback System
                    </li>
                    <li data-target="nutrition">
                        <i class="fas fa-apple-alt"></i> Nutrition Info
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <p><i class="fas fa-user-grad"></i> Student Portal</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="section-title">Today's Menu</h1>
                <div class="user-info">
                    <span id="user-greeting">Welcome, Student</span>
                    <i class="fas fa-user-circle fa-2x"></i>
                    <button id="logout-btn" style="margin-left: 15px; padding: 5px 10px; cursor: pointer; border-radius: 5px; border: 1px solid #ddd;">Logout</button>
                </div>
            </header>

            <section id="content-area">
                <!-- Today's Menu Section -->
                <div id="todays-menu" class="content-section active">
                    <div class="day-selector">
                        <button class="day-btn" data-day="Monday">Mon</button>
                        <button class="day-btn" data-day="Tuesday">Tue</button>
                        <button class="day-btn" data-day="Wednesday">Wed</button>
                        <button class="day-btn" data-day="Thursday">Thu</button>
                        <button class="day-btn" data-day="Friday">Fri</button>
                        <button class="day-btn" data-day="Saturday">Sat</button>
                        <button class="day-btn" data-day="Sunday">Sun</button>
                    </div>
                    <div id="menu-container" class="menu-grid">
                        <!-- Menu cards will be injected here -->
                    </div>
                </div>

                <!-- Attendance Section -->
                <div id="attendance" class="content-section">
                    <div class="attendance-container">
                        <h2>Mark Your Attendance</h2>
                        <div id="attendance-list" class="attendance-card">
                            <!-- Attendance rows will be injected here -->
                        </div>
                    </div>
                </div>

                <!-- Feedback Section -->
                <div id="feedback" class="content-section">
                    <div class="feedback-container">
                        <h2>Meal Feedback</h2>
                        <form class="feedback-form">
                            <div class="form-group">
                                <label>Select Meal</label>
                                <select id="feedback-meal-select">
                                    <option>Breakfast</option>
                                    <option>Lunch</option>
                                    <option>Snacks</option>
                                    <option>Dinner</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Rating</label>
                                <div class="stars" id="star-rating">
                                    <i class="fas fa-star" data-rating="1"></i>
                                    <i class="fas fa-star" data-rating="2"></i>
                                    <i class="fas fa-star" data-rating="3"></i>
                                    <i class="fas fa-star" data-rating="4"></i>
                                    <i class="far fa-star" data-rating="5"></i>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Comments</label>
                                <textarea id="feedback-comments" placeholder="How was the food today?"></textarea>
                            </div>
                            <button type="submit" class="submit-btn">Submit Feedback</button>
                        </form>
                    </div>
                </div>

                <!-- Nutrition Section -->
                <div id="nutrition" class="content-section">
                    <div id="nutrition-stats" class="nutrition-grid">
                        <!-- Stat cards will be injected here -->
                    </div>
                    <div class="nutrition-details">
                        <h3>Detailed Breakdown</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Nutrient</th>
                                    <th>Amount</th>
                                    <th>% Daily Value</th>
                                </tr>
                            </thead>
                            <tbody id="nutrition-table-body">
                                <!-- Nutrition rows will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="index.js"></script>
</body>
</html>
